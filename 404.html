   case, so try it lower case. That address has no capitals left, so a miss there stays on

     body stays hidden meanwhile); a capital in the address goes to the lower case one first. */
  if (/^\/@[A-Za-z0-9_]{3,24}\/[A-Za-z0-9-]{1,60}\/?$/.test(p)) {
    if (/[A-Z]/.test(p)) { location.replace(p.toLowerCase() + location.search + location.hash); return; }

    document.head.appendChild(l);
    var s = document.createElement('script');
    s.src = '/binder.js?v=1';
    document.head.appendChild(s);
  }
})();
</script>
